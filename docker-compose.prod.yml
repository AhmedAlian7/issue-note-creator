name: warehouse

x-runtime: &runtime
  env_file: .env.prod
  environment:
    DATABASE_URL: postgresql://issue_notes:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@db:5432/issue_notes?schema=public
    APP_BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env.prod}
    PDF_STORAGE_DIR: /data/pdfs
    PDF_RENDERER: playwright
    REQUIRE_PROVISIONED_PIN: "true"
    TZ: Africa/Cairo

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: issue_notes
      POSTGRES_USER: issue_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "issue_notes",
          "-d",
          "issue_notes",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    <<: *runtime
    build:
      context: .
      target: maintenance
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *runtime
    build: .
    restart: unless-stopped
    init: true
    shm_size: 256m
    volumes:
      - pdfs:/data/pdfs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health',{headers:{authorization:'Bearer '+process.env.HEALTH_SECRET}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      start_period: 30s
      interval: 30s
      timeout: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    init: true
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: issue_notes
      PGUSER: issue_notes
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - pdfs:/data/pdfs:ro
      - backups:/backups
    depends_on:
      app:
        condition: service_healthy

  reports:
    image: node:24-bookworm-slim
    restart: unless-stopped
    init: true
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env.prod}
    command: ["node", "/schedule.mjs"]
    volumes:
      - ./deploy/schedule.mjs:/schedule.mjs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  database:
  pdfs:
  backups:
  caddy-data:
  caddy-config:
