services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # The container reaches PostgreSQL by its Compose service name.
      DATABASE_URL: postgresql://issue_notes:local_dev_only@db:5432/issue_notes?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - note-pdfs:/data/pdfs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: issue_notes
      POSTGRES_USER: issue_notes
      POSTGRES_PASSWORD: local_dev_only
      TZ: ${TZ:-Africa/Cairo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "issue_notes",
          "-d",
          "issue_notes",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  note-pdfs:
  postgres-data:
