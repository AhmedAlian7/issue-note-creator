name: Deploy production

# Manual only. Merging to main never deploys. Configure the "production"
# environment with required reviewers for a second approval gate.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy
      - name: Build and deploy to Netlify
        run: npx --yes netlify-cli@latest deploy --build --prod
