name: Scheduled reports

# Hourly invocation. The endpoint decides which daily, weekly and monthly
# reports are due in Africa/Cairo and relies on ReportLog for idempotency.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-reports
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the protected report endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL" || { echo "::error::APP_BASE_URL secret is empty"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET secret is empty"; exit 1; }
          status=$(curl --silent --show-error --output body.json --write-out '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/reports")
          cat body.json
          test "$status" = "200"
